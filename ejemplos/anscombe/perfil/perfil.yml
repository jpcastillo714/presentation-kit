nombre: sobrio
descripcion: 'El perfil por defecto. Papel claro, tinta casi negra, un solo acento
  azul para lo que importa y un segundo acento (ladrillo) solo para advertencias y
  contrastes. Serif en los títulos-afirmación, sans en el resto. Tipografías que ya
  trae Windows, para que funcione sin internet y en cualquier proyector. Títulos en
  Cambria y no en Georgia: Georgia dibuja los números «a la antigua» (300 se lee «3oo»),
  mal para títulos con cifras. / Default profile: light paper, near-black ink, one
  blue accent for what matters and a brick accent only for warnings. Fonts shipped
  with Windows; Cambria titles because Georgia uses old-style numerals.'
